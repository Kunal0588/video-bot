name: Make video
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install requests Pillow
          pip install piper-tts==1.2.0 || echo "piper not installed; will use espeak-ng"
      - name: Build video
        run: python make_video.py
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/
          retention-days: 2
      - name: Publish to published branch
        run: |
          TITLE=$(python -c "import json;print(json.load(open('output/script.json'))['title'][:95])")
          mkdir -p /tmp/pub
          cp output/video.mp4 output/thumbnail.png output/meta.txt /tmp/pub/
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git checkout --orphan published
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/pub/* .
          git add video.mp4 thumbnail.png meta.txt
          git commit -m "$TITLE"
          git push --force origin published
